# XcodeGen spec (brew install xcodegen && xcodegen) — or create an iOS App target in Xcode and
# add these sources + the Swift package manually. Requires Xcode 16+, iOS 17.2+.
name: ConsentLensCompanion
options:
  deploymentTarget: { iOS: "17.2" }
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  ConsentLensCompanion:
    type: application
    platform: iOS
    sources: [Sources]
    info: { path: Info.plist }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.consentlens.companion
        META_APP_ID: ""      # from the Wearables Developer Center project
        CLIENT_TOKEN: ""     # from the Wearables Developer Center project
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATMockDevice
